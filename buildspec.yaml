version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 180294200579.dkr.ecr.eu-north-1.amazonaws.com
  build:
    commands:
      - docker build -t ai .
      - docker tag ai:latest 180294200579.dkr.ecr.eu-north-1.amazonaws.com/ai:latest
  post_build:
    commands:
      - docker push 180294200579.dkr.ecr.eu-north-1.amazonaws.com/ai:latest
      - echo Writing image definitions file...
      - printf '[{"name":"ai","imageUri":"%s"}]' 505076619770.dkr.ecr.eu-north-1.amazonaws.com/ai:latest > imagedefinitions.json   
artifacts:
  files: imagedefinitions.json
